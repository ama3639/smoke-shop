name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: smoke_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://smoke:test-only@127.0.0.1:5432/smoke_test
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test local startup sequencing
        run: python -m unittest discover -s scripts -p test_dev.py -v
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: backend/.venv/bin/python backend/manage.py check
      - run: backend/.venv/bin/python backend/manage.py makemigrations --check --dry-run
      - run: backend/.venv/bin/python backend/manage.py test shop
      - run: npm ci
        working-directory: frontend
      - name: Audit production dependencies (development exception in Security Notes)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Use installed Linux browser or install Chromium
        shell: bash
        working-directory: frontend
        run: |
          smoke_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$smoke_browser" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$smoke_browser" >> "$GITHUB_ENV"
            "$smoke_browser" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test local startup sequencing
        run: python -m unittest discover -s scripts -p test_dev.py -v
      - run: python -m venv backend/.venv
      - run: backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt
      - run: backend/.venv/Scripts/python.exe backend/manage.py check
      - run: backend/.venv/Scripts/python.exe backend/manage.py makemigrations --check --dry-run
      - run: backend/.venv/Scripts/python.exe backend/manage.py test shop
      - run: npm ci
        working-directory: frontend
      - name: Audit production dependencies (development exception in Security Notes)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Use installed Windows browser without regional CDN download
        shell: pwsh
        run: |
          $smokeBrowsers = @(
            "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe",
            "$env:ProgramFiles/Microsoft/Edge/Application/msedge.exe",
            "$env:ProgramFiles/Google/Chrome/Application/chrome.exe"
          )
          $smokeBrowser = $smokeBrowsers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $smokeBrowser) { throw "No installed Edge/Chrome found for Windows E2E" }
          "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$smokeBrowser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Get-Item $smokeBrowser).VersionInfo.ProductVersion
      - run: npm run test:e2e -- --max-failures=1
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-windows
          path: frontend/test-results/


